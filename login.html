<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Avisaí</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login">

        <header class="login-header">

            <img
                src="assets/icons/icone-branco.svg"
                alt="Avisaí"
                class="login-logo"
            >

            <h1>Bem-vindo de volta!</h1>

            <p>
                Entre pra ver o que está acontecendo<br>
                no seu bairro
            </p>

        </header>

        <section class="login-content">

            <div
                id="mensagem-login"
                class="mensagem-login"
                aria-live="polite"
            ></div>

            <form id="form-login">

                <div class="campo-login">
                    <label for="email">E-MAIL</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo-login">
                    <label for="senha">SENHA</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="mínimo 8 caracteres"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-entrar"
                >
                    Entrar
                </button>

            </form>

            <p class="criar-conta">
                Não tem conta?
                <a href="cadastro.html">Criar agora</a>
            </p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
