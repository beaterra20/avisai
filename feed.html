<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feed | Avisaí</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/feed.css">
</head>

<body>

    <main class="feed">

        <header class="feed-header">

            <div class="feed-brand">

                <img
                    src="assets/icons/icone-verde.svg"
                    alt=""
                    class="feed-brand-icon"
                >

                <span class="feed-brand-name">
                    Avisaí
                </span>

            </div>

           <button
    type="button"
    class="feed-avatar"
    id="avatar-usuario"
    aria-label="Abrir perfil"
>
</button>

        </header>

        <section class="feed-content">

            <div class="feed-search">

    <input
        type="search"
        id="busca-feed"
        placeholder="Buscar alertas e eventos..."
        aria-label="Buscar alertas e eventos"
    >

    <a
        href="publicar-alerta.html"
        class="feed-add-alert"
        aria-label="Criar novo alerta"
    >
        +
    </a>

</div>

            <div class="feed-divider"></div>

            <section
                class="feed-empty"
                id="feed-vazio"
            >

                <h1>
                    Ainda não há alertas por aqui 📍
                </h1>

                <p>
                    Quando houver alertas ou eventos
                    importantes na sua região, eles
                    aparecerão neste espaço.
                </p>

                <a
                    href="publicar-alerta.html"
                    class="feed-create-alert"
                >
                    <span class="feed-create-icon">+</span>

                    <span>
                        Criar alerta
                    </span>
                </a>

            </section>

            <section
    class="feed-alertas"
    id="feed-alertas"
>
</section>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/feed.js"></script>

</body>

</html>
